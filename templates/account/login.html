{% extends "base.html" %}
{% load socialaccount %}

{% block title %}로그인{% endblock %}

{% block content %}
  <div class="card bg-base-100 shadow max-w-md mx-auto">
    <div class="card-body">
      <h2 class="card-title">로그인</h2>
      <p class="text-sm opacity-75 mb-4">소셜 계정으로 로그인하세요.</p>
      <div class="flex flex-col gap-2">
        <form method="post" action="{% provider_login_url 'google' %}">
          {% csrf_token %}
          <button type="submit" class="btn w-full">Google로 계속하기</button>
        </form>
        <form method="post" action="{% provider_login_url 'github' %}">
          {% csrf_token %}
          <button type="submit" class="btn w-full">GitHub으로 계속하기</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
