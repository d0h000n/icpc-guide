[project]
name = "ps-tracker"
version = "0.1.0"
description = "ICPC/CERC/WF problem set tracking and quality rating service"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "django-allauth[socialaccount]>=0.63",
    "django-environ>=0.11",
    "django-treebeard>=4.7",
    "whitenoise>=6.6",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "sentry-sdk[django]>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests", "apps"]
addopts = "-ra"
