name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ps_tracker
          POSTGRES_PASSWORD: ps_tracker
          POSTGRES_DB: ps_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ps_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://ps_tracker:ps_tracker@localhost:5432/ps_tracker
      SECRET_KEY: ci-insecure
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.9"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run migrations (dry check)
        run: uv run python manage.py migrate --noinput

      - name: Pytest
        run: uv run pytest
