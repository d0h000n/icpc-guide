categories:
- short_name: icpc
  name: ICPC
  description: 전 세계 ICPC 대회 문제들을 모아둔 세트로, 다양한 알고리즘 분야를 고르게 다루며 문제 해결의 균형감각을 요구한다.
- short_name: jpn
  name: Japan
  description: 일본 대회 문제들을 중심으로 구성된 세트로, 독창적인 발상과 정교한 관찰을 요구하는 문제가 자주 등장한다.
  url: https://qoj.ac/category/49
- short_name: kor
  name: Korea
  description: 한국 대회 문제들을 중심으로 구성된 세트로, 구현 비중이 높고 자료구조·DP를 활용한 실전적인 문제가 자주 등장한다.
  url: https://qoj.ac/category/50
- short_name: oi
  name: Olympiad in Informatics
  description: 정보올림피아드 계열 문제들을 모아둔 세트로, 구현보다는 아이디어와 정해 풀이를 찾는 능력이 중요하다.
  url: https://qoj.ac/category/3
- short_name: pol
  name: Poland
  description: 폴란드 대회 문제들을 중심으로 구성된 세트로, 난이도가 높고 자료구조·그래프·수학을 활용한 정교한 문제들이 많다.
- short_name: rus
  name: Russia
  description: 러시아 대회 문제들을 중심으로 구성된 세트로, 수학적 사고와 정교한 알고리즘 설계를 요구하는 경우가 많다.
- short_name: univ
  name: University / School
  description: 대학·학교 단위 대회 문제들을 중심으로 구성된 세트로, 정형화된 스타일보다 출제진의 개성이 강하게 드러나는 편이다.
